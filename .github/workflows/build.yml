name: Build
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build
      - name: Upload Paper artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paper-jars
          path: paper/build/libs/connector-paper-*-all.jar
      - name: Upload Velocity artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-jars
          path: velocity/build/libs/connector-velocity-*-all.jar
